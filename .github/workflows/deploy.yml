name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: splice-ai-cn-shanghai.cr.volces.com
  IMAGE_NAME: splice-ai/qiaopi-generator-nextjs

jobs:
  build-and-deploy:
    runs-on: [self-hosted, qiaopi-generator]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Volcengine CR
        run: |
          printf '%s' '${{ secrets.VOLCENGINE_CR_PASSWORD }}' | docker login ${{ env.REGISTRY }} -u '${{ secrets.VOLCENGINE_CR_USERNAME }}' --password-stdin

      - name: Build & Push
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.SERVER_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H '${{ secrets.SERVER_HOST }}' >> ~/.ssh/known_hosts

      - name: Upload compose file
        run: |
          ssh -i ~/.ssh/deploy_key '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' 'mkdir -p /home/deploy/qiaopi-generator'
          scp -i ~/.ssh/deploy_key docker-compose.yml '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/deploy/qiaopi-generator/docker-compose.yml'

      - name: Deploy to Server
        timeout-minutes: 60
        run: |
          ssh -i ~/.ssh/deploy_key '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' <<'REMOTE'
            cd /home/deploy/qiaopi-generator
            printf '%s' '${{ secrets.VOLCENGINE_CR_PASSWORD }}' | docker login ${{ env.REGISTRY }} -u '${{ secrets.VOLCENGINE_CR_USERNAME }}' --password-stdin
            cat > .env <<'EOF'
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY_PRODUCTION }}
            DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }}
            EOF
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          REMOTE
