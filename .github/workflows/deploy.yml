name: Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: splice-ai-cn-shanghai.cr.volces.com
  IMAGE_NAME: splice-ai/qiaopi-generator-nextjs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: qiaopi-generator-nextjs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker save qiaopi-generator-nextjs:${{ github.sha }} | gzip > qiaopi-generator-nextjs.tar.gz

      - name: Upload image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: qiaopi-generator-nextjs.tar.gz
          target: /home/deploy/qiaopi-generator

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        timeout-minutes: 60
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          script: |
            cd /home/deploy/qiaopi-generator
            printf '%s' '${{ secrets.VOLCENGINE_CR_PASSWORD }}' | docker login ${{ env.REGISTRY }} -u '${{ secrets.VOLCENGINE_CR_USERNAME }}' --password-stdin
            docker load -i qiaopi-generator-nextjs.tar.gz
            docker tag qiaopi-generator-nextjs:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker tag qiaopi-generator-nextjs:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            cat > .env <<'EOF'
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY_PRODUCTION }}
            DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }}
            EOF
            docker compose pull
            docker compose up -d --remove-orphans
            rm -f qiaopi-generator-nextjs.tar.gz
            docker image prune -f
