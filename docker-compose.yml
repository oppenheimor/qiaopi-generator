services:
  nextjs:
    image: splice-ai-cn-shanghai.cr.volces.com/splice-ai/qiaopi-generator-nextjs:latest
    container_name: qiaopi-generator-nextjs
    restart: always
    networks:
      - app-network
    env_file:
      - .env
    environment:
      - NODE_ENV=production

networks:
  app-network:
    external: true